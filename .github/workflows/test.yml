name: Test

# Pull requests are tested on their own event; pushes only for main, so a
# branch with an open PR isn't tested twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Two commits deep, so a pull request's merge commit has its base
      # (HEAD^1) for the bundle growth check.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The bundle growth check compares against the commit this change builds
      # on: the base of a pull request, or main before a push.
      - name: Resolve bundle growth base
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "LUMNO_BUNDLE_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            # Deepen until the pushed commits reach the old main, so every
            # pushed commit message is there for a Bundle-Growth trailer.
            for _ in 1 2 3 4 5; do
              git merge-base --is-ancestor "$BEFORE_SHA" HEAD 2>/dev/null && break
              git fetch --no-tags --deepen=20 origin "$GITHUB_REF"
            done
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            echo "LUMNO_BUNDLE_BASE=$BEFORE_SHA" >> "$GITHUB_ENV"
          fi

      # The built scripts are build output, not committed, so the base's are
      # measured by building it in a worktree of its own.
      - name: Build the base's scripts
        if: ${{ env.LUMNO_BUNDLE_BASE != '' }}
        shell: bash
        run: |
          base_dir="$RUNNER_TEMP/bundle-base"
          git worktree add --detach "$base_dir" "$LUMNO_BUNDLE_BASE"
          if (cd "$base_dir" && npm ci --ignore-scripts --no-audit --no-fund && npm run build); then
            echo "LUMNO_BUNDLE_BASE_DIR=$base_dir" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not build the scripts of $LUMNO_BUNDLE_BASE; only the bundle ceilings are checked."
          fi

      # Builds the extension once, runs the Vitest projects, then the static
      # checks (the same ones npm run check runs after its own build).
      - name: Run tests and checks
        run: npm run verify

      # The flows drive the built extension in the runner's Chrome.
      - name: Run end-to-end flows
        run: npm run test:e2e
